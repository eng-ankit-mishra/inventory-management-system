name: Deploy to EC2

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------
      # 1. Checkout Code
      # ------------------------------------
      - name: Checkout code
        uses: actions/checkout@v3

      # ------------------------------------
      # 2. Login to Docker Hub
      # ------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ------------------------------------
      # 3. Build & Push Backend
      # ------------------------------------
      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/inventory-backend:v1

      # ------------------------------------
      # 4. Inject Frontend API URL
      # ------------------------------------
      - name: Create .env.production for Frontend
        run: |
          echo "VITE_API_URL=http://${{ secrets.EC2_HOST }}:8080" > ./frontend/.env.production

      # ------------------------------------
      # 5. Build & Push Frontend
      # ------------------------------------
      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/inventory-frontend:v1

      # ------------------------------------
      # 6. Deploy to EC2
      # ------------------------------------
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/

            # Create FULL .env file (Database + SMTP + App)
            cat > .env << EOF
            SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/inventory_db
            SPRING_DATASOURCE_USERNAME=${{ secrets.POSTGRES_USER }}
            SPRING_DATASOURCE_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            SPRING_JPA_HIBERNATE_DDL_AUTO=update

            SPRING_MAIL_HOST=${{ secrets.SMTP_HOST }}
            SPRING_MAIL_PORT=${{ secrets.SMTP_PORT }}
            SPRING_MAIL_USERNAME=${{ secrets.SMTP_USERNAME }}
            SPRING_MAIL_PASSWORD=${{ secrets.SMTP_PASSWORD }}

            APP_BASE_URL=http://${{ secrets.EC2_HOST }}
            EOF

            # Pull latest images
            sudo docker compose pull

            # Restart containers with new env
            sudo docker compose up -d

            # Clean old unused images
            sudo docker image prune -f
