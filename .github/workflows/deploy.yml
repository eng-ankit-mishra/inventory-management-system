name: Deploy to EC2

on:
  push:
    branches:
      - master  # Ensure this matches your branch name (main vs master)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Backend Build (No env changes needed here usually)
      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/inventory-backend:v1

      # ---------------------------------------------------------
      # 4. THE FIX: Inject the API URL before building Frontend
      # ---------------------------------------------------------
      - name: Create .env file for Frontend
        run: |
          # We manually create the .env.production file right now
          # This tells Vite: "When you build in the next step, use THIS url"
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" > ./frontend/.env.production

      # 5. Frontend Build (Now it will see the file we just made!)
      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/inventory-frontend:v1

      # 6. Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/
            sudo docker compose pull
            sudo docker compose up -d
            sudo docker image prune -f