name: Deploy to EC2

on:
  push:
    branches:
      - main  # Triggers whenever you push to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend  # Path to your backend folder
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/inventory-backend:v1

      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend # Path to your frontend folder
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/inventory-frontend:v1

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Navigate to where your docker-compose file is
            # (Adjust this path if you put the file somewhere else!)
            cd /home/ec2-user/ 
            
            # Pull the new images we just pushed
            sudo docker compose pull
            
            # Restart the containers with the new images
            sudo docker compose up -d
            
            # Clean up old/unused images to save space
            sudo docker image prune -f