name: Deploy to EC2

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Backend Build
      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/inventory-backend:v1

      # 4. Inject the API URL before building Frontend
      - name: Create .env file for Frontend
        run: |
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" > ./frontend/.env.production

      # 5. Frontend Build
      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/inventory-frontend:v1

      # ---------------------------------------------------------
      # 6. THE FIX: Inject Runtime Secrets on EC2
      # ---------------------------------------------------------
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/
            
            # Create the .env file for Docker Compose to read
            echo "SMTP_HOST=${{ secrets.SMTP_HOST }}" > .env
            echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> .env
            echo "SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}" >> .env
            echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> .env
            
            # Pull latest images and restart containers using the new .env file
            sudo docker compose pull
            sudo docker compose --env-file .env up -d
            sudo docker image prune -f