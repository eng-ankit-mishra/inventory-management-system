version: '3.8'
services:
  frontend:
    image: amishra264/inventory-frontend:v1
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

  backend:
    image: amishra264/inventory-backend:v1
    ports:
      - "8080:8080"
    environment:
      # FIXED: Added underscore to match the database name below
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 0208
    depends_on:
      - postgres
    restart: always

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: inventory_db  # Matches the URL above now
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 0208
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data: